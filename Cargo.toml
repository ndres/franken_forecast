[workspace]
resolver = "2"
members = [
    "crates/fcast-core",
    "crates/fcast-infra",
    "crates/fcast-ingest",
    "crates/fcast-epistemic",
    "crates/fcast-bench",
    "crates/fcast-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "warn"

[workspace.dependencies]
# Internal 6-crate acyclic DAG (§17)
fcast-core = { path = "crates/fcast-core" }
fcast-infra = { path = "crates/fcast-infra" }
fcast-ingest = { path = "crates/fcast-ingest" }
fcast-epistemic = { path = "crates/fcast-epistemic" }
fcast-bench = { path = "crates/fcast-bench" }

# Upstream Franken Suite crates (Edition 2024, nightly-2026-08-31)
# M1/M3 crates (asupersync, fnp-ndarray) are added as their milestones open so M0 stays zero-warning.
fsqlite = { git = "https://github.com/Dicklesworthstone/frankensqlite", package = "fsqlite" }

# Pure-Rust foundational crates (0 banned runtimes, 0 C/C++ FFI)
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zstd = "0.13"
proptest = "1.6"
tempfile = "3.15"
