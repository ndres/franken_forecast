[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
]
exceptions = [
    { allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"], crate = "asupersync" },
    { allow = ["LicenseRef-MIT-OpenAI-Anthropic-Rider"], crate = "fsqlite" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "tokio", wrappers = [] },
    { name = "reqwest", wrappers = [] },
    { name = "hyper", wrappers = [] },
    { name = "ort", wrappers = [] },
    { name = "openssl-sys", wrappers = [] },
    { name = "rusqlite", wrappers = [] },
    { name = "sqlx", wrappers = [] },
    { name = "petgraph", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Dicklesworthstone/frankensqlite",
    "https://github.com/Dicklesworthstone/asupersync",
    "https://github.com/Dicklesworthstone/franken_numpy",
]
